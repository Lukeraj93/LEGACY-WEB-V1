<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset Password | LEGACY+ Coaching</title>
    <meta
      name="description"
      content="Set a new password for your LEGACY+ client, coach, or admin account."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@600;700;800&amp;family=Montserrat:wght@500;600;700;800&amp;family=Roboto:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260402deployready1" />
  </head>
  <body class="account-entry-page account-reset-page">
    <div class="cinematic-bg" aria-hidden="true">
      <div class="bg-layer bg-layer--base"></div>
      <div class="bg-layer bg-layer--smoke"></div>
      <div class="bg-layer bg-layer--embers"></div>
      <div class="bg-vignette"></div>
    </div>

    <main class="pt-mode-main account-entry-main">
      <section class="pt-mode-shell account-entry-shell reveal in-view">
        <div class="account-reset-stage">
          <div class="account-reset-card">
            <span class="kicker">Account Recovery</span>
            <h1>Set your new password</h1>
            <p>
              Choose a new password for your LEGACY+ account. After saving it, you can go straight back to the login page.
            </p>

            <form class="contact-form account-reset-form" id="account-password-update-form">
              <label>
                New password
                <input type="password" name="newPassword" placeholder="Enter new password" minlength="6" required />
              </label>
              <label>
                Confirm new password
                <input
                  type="password"
                  name="confirmPassword"
                  placeholder="Confirm new password"
                  minlength="6"
                  required
                />
              </label>
              <div class="account-registration-actions">
                <button class="btn btn-primary" type="submit">Update password</button>
                <a class="btn btn-secondary" href="./account.html">Back to login</a>
              </div>
              <p class="dashboard-feedback" id="account-password-update-feedback">
                Open this page from the password reset email sent to your inbox.
              </p>
            </form>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./auth-config.js?v=20260405localapp1"></script>
    <script src="./auth-client.js?v=20260402deployready1"></script>
    <script src="./script.js?v=20260402deployready1"></script>
  </body>
</html>
